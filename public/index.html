<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>flantastic — remote control</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🖥️ flantastic</h1>
    <div class="header-actions">
      <span id="status-line" class="muted"></span>
      <button id="refresh" class="btn ghost" title="Refresh">↻ Refresh</button>
    </div>
  </header>

  <main>
    <div id="error" class="error" hidden></div>
    <div id="endpoints"></div>
    <p id="empty" class="muted" hidden>No endpoints configured. Copy <code>endpoints.example.json</code> to <code>endpoints.json</code> and add your machines.</p>
  </main>

  <template id="endpoint-tpl">
    <section class="endpoint">
      <h2 class="endpoint-title">
        <span class="type-badge"></span>
        <span class="endpoint-label"></span>
        <span class="endpoint-host muted"></span>
      </h2>
      <div class="grid"></div>
      <p class="endpoint-error error" hidden></p>
    </section>
  </template>

  <template id="card-tpl">
    <div class="card">
      <div class="card-top">
        <span class="dot"></span>
        <span class="name"></span>
        <span class="state badge"></span>
      </div>
      <div class="card-detail muted"></div>
      <div class="card-actions">
        <button class="btn start">Start</button>
        <button class="btn stop">Stop</button>
        <button class="btn primary connect">Connect</button>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
